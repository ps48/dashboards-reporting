name: Test and Build Kibana Reports

on: [pull_request, push]

env:
  PLUGIN_NAME: opendistroReportsKibana
  OD_VERSION: 1.13.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kibana
        uses: actions/checkout@v5
        with:
          repository: elastic/kibana
          ref: v7.10.2
          path: kibana

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "10.23.1"

      - name: Checkout Plugin
        uses: actions/checkout@v4
        with:
          path: kibana/plugins/${{ env.PLUGIN_NAME }}

      - name: Kibana Plugin Bootstrap
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: cd kibana && yarn kbn bootstrap

      - name: Test
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: cd kibana && yarn test --coverage

      - name: Uploads coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build Artifact
        run: |
          yarn build
          mv ./build/*.zip ./build/${{ env.PLUGIN_NAME }}-${{ env.OD_VERSION }}.zip || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: kibana-reports
          path: ./build/${{ env.PLUGIN_NAME }}-${{ env.OD_VERSION }}.zip
